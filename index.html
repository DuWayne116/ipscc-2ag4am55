<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis has moved</title>
<meta http-equiv="refresh" content="6;url=https://ips-jarvis.ipspackaging.workers.dev/">
<style>html,body{height:100%;margin:0;background:#020a16;color:#3ff0ff;font-family:"Segoe UI",Consolas,monospace;display:flex;align-items:center;justify-content:center;text-align:center}
.b{padding:28px;border:1px solid rgba(63,240,255,.4);max-width:520px}h1{letter-spacing:.3em;font-size:22px}a{color:#4dffa6;font-size:18px}p{color:#9fe9ff;line-height:1.5}</style>
<script>
// clear the old v3 service worker + cache so this device stops loading the old Command Centre
if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
if(window.caches) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));
</script></head>
<body><div class="b"><h1>JARVIS HAS MOVED</h1>
<p>The IPS Command Centre now lives at a new address, synced across your phone, laptop and Telegram.</p>
<p><a href="https://ips-jarvis.ipspackaging.workers.dev/">ips-jarvis.ipspackaging.workers.dev</a></p>
<p style="font-size:12px">Taking you there in a few seconds… If you installed the old app, remove it and install from the new address.</p></div></body></html>
